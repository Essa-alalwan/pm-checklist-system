services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmlogbook
      POSTGRES_PASSWORD: pmlogbook
      POSTGRES_DB: pmlogbook
    ports:
      - "5432:5432"
    volumes:
      - pmlogbook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmlogbook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmlogbook_pgdata:
